const FIT_LABEL={good:"추천",caution:"주의",bad:"비추천"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/[\s()\[\]{}·,./\-_+]/g,"")}
function gradeColor(g){return g<=2?"#3a9b6e":g<=6?"#c98a1b":"#c4534f"}

// 성분 사전 인덱스 (정규화된 한글명·영문명 → 성분)
const INDEX=[];
DATA.ingredients.forEach(i=>{
  INDEX.push({key:norm(i.korean_name),ing:i});
  if(i.inci_name) INDEX.push({key:norm(i.inci_name),ing:i});
});

function commonPrefix(a,b){ let n=0; const m=Math.min(a.length,b.length); while(n<m&&a[n]===b[n])n++; return n; }
function matchToken(tok){
  const t=norm(tok);
  if(t.length<2) return null;
  // 1) 완전 일치  2) 포함(사전명 3자+)  3) 공통 접두 5자 이상(예: 센텔라아시아티카추출물 ↔ 센텔라아시아티카)
  let best=null, bestScore=0;
  for(const e of INDEX){
    if(!e.key) continue;
    if(e.key===t) return e.ing;
    let score=0;
    if(t.includes(e.key) && e.key.length>=3) score=e.key.length+1;
    else if(e.key.includes(t) && t.length>=3) score=t.length;
    else { const cp=commonPrefix(e.key,t); if(cp>=5) score=cp; }
    if(score>bestScore){ bestScore=score; best=e.ing; }
  }
  return best;
}

}

function analyze(){
  const raw=document.getElementById("input").value.trim();
  if(!raw){ alert("전성분을 붙여넣어 주세요."); return; }
  const skin=document.getElementById("skin").value;
  // 토큰 분리: 쉼표·줄바꿈·가운뎃점·세미콜론
  const tokens=raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);

  const matched=[], unknown=[], seen=new Set();
  tokens.forEach(tok=>{
    const ing=matchToken(tok);
    if(ing){ if(!seen.has(ing.id)){ seen.add(ing.id); matched.push(ing); } }
    else unknown.push(tok.replace(/\d+(\.\d+)?%?$/,"").trim());
  });

  // 피부타입 기준 적합도 집계
  let bad=0,cau=0,good=0;
  if(skin) matched.forEach(i=>{ const v=i.skin_types[skin]; if(v==="bad")bad++; else if(v==="caution")cau++; else if(v==="good")good++; });

  // 요약
  const sum=document.getElementById("summary");
  if(!skin){
    sum.className="summary s-good";
    sum.innerHTML=`<b>${matched.length}개 성분을 분석했어요.</b><br>피부타입을 선택하면 나에게 맞는지까지 알려드려요.
      <div class="stat"><span>인식 ${matched.length}개</span><span>미인식 ${unknown.length}개</span></div>`;
  } else {
    let cls="s-good", msg="";
    if(bad>0){ cls="s-bad"; msg=`<b>${skin} 피부에 주의가 필요한 제품이에요.</b><br>비추천 성분 ${bad}개가 포함돼 있어요. 사용 전 패치 테스트를 권해요.`; }
    else if(cau>=2){ cls="s-cau"; msg=`<b>${skin} 피부에 대체로 무난하지만 주의 성분이 있어요.</b><br>주의 성분 ${cau}개를 확인하세요.`; }
    else { cls="s-good"; msg=`<b>${skin} 피부에 잘 맞는 편이에요! 👍</b><br>추천 성분 ${good}개가 들어 있어요.`; }
    sum.className="summary "+cls;
    sum.innerHTML=msg+`<div class="stat"><span>👍 추천 ${good}</span><span>⚠️ 주의 ${cau}</span><span>🚫 비추천 ${bad}</span><span>미인식 ${unknown.length}</span></div>`;
  }

  // 성분 목록: 주의도 높은 순(bad>caution>good), 그 다음 안전등급
  const rank=i=>{ if(!skin) return 10-i.safety_grade; const v=i.skin_types[skin]; return ({bad:0,caution:1,good:2}[v]??1)*100 - i.safety_grade; };
  matched.sort((a,b)=>rank(a)-rank(b));
  document.getElementById("matched").innerHTML=matched.map(i=>{
    const v=skin?i.skin_types[skin]:null;
    const fit=v?`<span class="fit ${v}">${skin} ${FIT_LABEL[v]}</span>`:"";
    return `<div class="ing">
      <span class="gb" style="background:${gradeColor(i.safety_grade)}">${i.safety_grade}</span>
      <div class="info"><div class="nm"><a href="detail/${encodeURIComponent(i.id)}.html">${esc(i.korean_name)}</a></div>
        <div class="meta">${esc(i.category)} · ${esc((i.benefits||[]).slice(0,3).join(", "))}</div></div>
      ${fit}</div>`;
  }).join("") || '<p class="unknown">사전에 등록된 성분을 찾지 못했어요.</p>';

  // 미인식
  const ub=document.getElementById("unknownBox");
  if(unknown.length){
    const uniq=[...new Set(unknown.filter(u=>u.length>1))].slice(0,30);
    ub.innerHTML=`<h2>❓ 사전에 없는 성분 (${uniq.length})</h2>
      <div class="unknown">아직 사전에 없거나 표기가 달라 인식하지 못한 성분이에요:<br><b>${uniq.map(esc).join(", ")}</b></div>`;
  } else ub.innerHTML="";

  // 제휴 제품 추천 (피부타입 매칭, 분석된 성분과 겹치면 우선)
  const pb=document.getElementById("productBox");
  let prods=(PRODUCTS.products||[]).filter(p=>p.status==="active"||p.url);
  if(skin) prods=prods.filter(p=>(p.skin_types||[]).includes(skin));
  if(prods.length){
    pb.innerHTML=`<h2>🛒 ${skin?skin+" 피부":"내 피부"} 추천 제품</h2><div class="pgrid">${prods.slice(0,4).map(pcard).join("")}</div>
      <div class="affiliate-notice">${esc(PRODUCTS.affiliate_notice||"")}</div>`;
  } else pb.innerHTML="";

  document.getElementById("result").style.display="block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function pcard(p){
  const img=p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:"";
  const badge=p.source?`<span class="psrc">${esc(p.source)}</span>`:"";
  const src=p.source?esc(p.source):"제휴처";
  return `<a class="pcard" href="${esc(p.url)}" target="_blank" rel="nofollow sponsored noopener">
    ${img}<div class="pb">${badge}<div class="pn">${esc(p.name)}</div><span class="pbt">${src}에서 보기 →</span></div></a>`;
}
</script>
</body>
</html>
