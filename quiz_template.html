<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피부타입 진단 — 내게 맞는 성분 찾기 | 성분 사전</title>
<meta name="description" content="7가지 질문으로 피부타입을 진단하고, 건성·지성·민감성·복합성·여드름성에 맞는 화장품 성분을 추천받으세요.">
<meta name="robots" content="index,follow">
<style>
  :root{
    --bg:#faf7f4; --card:#fff; --ink:#2b2622; --sub:#8a7f76;
    --accent:#b08968; --accent-dark:#8c6a4f; --line:#eee5dd;
    --good:#3a9b6e; --good-bg:#e7f5ee; --bad:#c4534f; --bad-bg:#fbe9e8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  header{background:linear-gradient(135deg,#f3e9df,#e9d9c8);padding:44px 24px 34px;text-align:center}
  header h1{font-size:27px;font-weight:800;letter-spacing:-0.5px}
  header p{color:#7a6a58;margin-top:8px;font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:24px}
  .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:20px}
  .bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .qnum{font-size:13px;color:var(--accent);font-weight:700}
  .qtext{font-size:19px;font-weight:700;margin:8px 0 18px}
  .opt{display:block;width:100%;text-align:left;padding:15px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:10px;transition:.15s}
  .opt:hover{border-color:var(--accent);background:#fcf8f4}
  .nav{display:flex;justify-content:space-between;margin-top:6px}
  .nav button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:14px;cursor:pointer}
  .nav button:disabled{opacity:.4;cursor:default}
  /* 결과 */
  .result{display:none}
  .rtype{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;margin-bottom:18px}
  .rtype .big{font-size:30px;font-weight:800;color:var(--accent-dark)}
  .rtype .lead{color:#4d453e;margin-top:10px;font-size:15px}
  h2{font-size:17px;margin:24px 0 12px;color:#6e4f3a}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:7px}
  .icard .kn{font-size:16px;font-weight:700}
  .icard .kn a{color:inherit;text-decoration:none}
  .icard .kn a:hover{color:var(--accent);text-decoration:underline}
  .icard .cat{font-size:11px;background:#f3ece5;color:var(--accent-dark);padding:3px 9px;border-radius:999px;align-self:flex-start}
  .icard .d{font-size:13px;color:#6e635a}
  .icard .b{display:flex;flex-wrap:wrap;gap:5px}
  .icard .b span{font-size:11px;background:#f6f1ec;color:#6e635a;padding:2px 8px;border-radius:6px}
  .avoid .icard{border-color:#f0d6d3;background:#fdf6f5}
  .pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;background:#fff;transition:.15s}
  .pcard:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(176,137,104,.15)}
  .pcard img{width:100%;height:130px;object-fit:cover;background:#f3ece5}
  .pcard .pb{padding:13px;display:flex;flex-direction:column;gap:6px;flex:1}
  .pcard .psrc{align-self:flex-start;font-size:10.5px;font-weight:700;color:var(--good);background:var(--good-bg);padding:2px 8px;border-radius:999px}
  .pcard .pn{font-size:14px;font-weight:700;line-height:1.4}
  .pcard .pnote{font-size:12px;color:var(--sub);flex:1}
  .pcard .prow{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .pcard .ppr{font-size:13px;font-weight:700;color:var(--accent-dark)}
  .pcard .pbt{font-size:12px;color:var(--accent);font-weight:600}
  .affiliate-notice{font-size:11.5px;color:#a4937f;background:#f6f1ec;border-radius:8px;padding:9px 12px;margin-top:10px;line-height:1.5}
  /* 리포트 신청 폼 */
  .lead-form{background:linear-gradient(135deg,#f3e9df,#efe1d2);border:1px solid var(--line);border-radius:18px;padding:26px;margin:22px 0}
  .lf-title{font-size:18px;font-weight:800;color:var(--accent-dark)}
  .lf-sub{font-size:14px;color:#7a6a58;margin:6px 0 16px}
  .lead-form input[type=email]{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fff;margin-bottom:12px}
  .lf-consent{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#6e635a;margin-bottom:14px;cursor:pointer;line-height:1.5}
  .lf-consent input{margin-top:3px}
  .lf-consent a{color:var(--accent-dark)}
  .lead-form button{width:100%;padding:14px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .lead-form button:hover{background:var(--accent-dark)}
  .lead-form button:disabled{opacity:.5;cursor:default}
  .lf-kakao{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:11px;background:#FEE500;color:#3c1e1e;font-weight:700;font-size:15px;text-decoration:none}
  .lf-done{display:none;background:var(--good-bg);color:var(--good);border-radius:11px;padding:14px;text-align:center;font-weight:600;font-size:15px;margin-top:12px}
  .restart{display:inline-block;margin:24px 0;padding:12px 22px;border-radius:12px;background:var(--accent);color:#fff;border:none;font-size:15px;cursor:pointer;text-decoration:none}
  .home{display:block;text-align:center;margin-top:10px;color:var(--accent);text-decoration:none;font-size:14px}
  footer{text-align:center;padding:30px 16px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>🧫 내 피부타입 진단</h1>
  <p>7가지 질문으로 피부타입을 알아보고, 맞는 성분을 추천받으세요</p>
</header>
<div class="wrap">
  <div class="bar"><i id="prog"></i></div>
  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="rtype">
      <div>당신의 피부타입은</div>
      <div class="big" id="rtype">—</div>
      <div class="lead" id="rlead"></div>
    </div>

    <form class="lead-form" name="skin-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="leadForm">
      <input type="hidden" name="form-name" value="skin-report">
      <input type="hidden" name="skin_type" id="f_type">
      <p hidden><label>이 칸은 비워두세요 <input name="bot-field"></label></p>
      <div class="lf-title">📩 내 피부 맞춤 리포트 받기</div>
      <div class="lf-sub">진단 결과와 추천 성분 정리본, 그리고 새로 추가되는 성분 소식을 이메일로 보내드려요.</div>
      <input type="email" name="email" id="f_email" placeholder="이메일 주소를 입력하세요" required>
      <label class="lf-consent">
        <input type="checkbox" id="f_consent" required>
        <span>개인정보 수집·이용 및 마케팅 정보 수신에 동의합니다. (수집 항목: 이메일·진단결과 / 목적: 맞춤 리포트·신규 성분 안내 / 보유: 동의 철회 시까지)</span>
      </label>
      <button type="submit">리포트 받기</button>
      <!-- 카카오톡 채널을 만든 뒤 아래 href를 채널 추가 URL(http://pf.kakao.com/_xxxxx)로 바꾸면 활성화됩니다 -->
      <a class="lf-kakao" id="kakaoBtn" href="#" style="display:none">💬 카카오톡 채널로 소식 받기</a>
      <div class="lf-done" id="leadDone">신청 완료! 입력하신 이메일로 맞춤 리포트를 보내드릴게요. 🌿</div>
    </form>

    <h2>✅ 추천 성분</h2>
    <div class="grid" id="recommend"></div>
    <div id="productSection" style="display:none">
      <h2>🛒 당신에게 맞는 추천 제품</h2>
      <div class="grid" id="products"></div>
      <div class="affiliate-notice" id="affNotice"></div>
    </div>
    <h2>⚠️ 주의가 필요한 성분</h2>
    <div class="grid avoid" id="avoid"></div>
    <button class="restart" onclick="restart()">다시 진단하기</button>
    <a class="home" href="index.html">전체 성분 사전 둘러보기 →</a>
  </div>
</div>
<footer>진단 결과는 일반적인 참고용이며 의학적 진단이 아닙니다. 피부 고민이 지속되면 피부과 전문의와 상담하세요.</footer>

<script>
const DATA = /*__DATA__*/;
const PRODUCTS = /*__PRODUCTS__*/;
const TYPES = ["건성","지성","민감성","복합성","여드름성"];

// 각 보기는 피부타입별 점수(s)와 고민 태그(goal)를 더한다
const QUESTIONS = [
  {q:"세안 후 30분, 아무것도 바르지 않았을 때 피부는?", opts:[
    {t:"심하게 당기고 각질이 일어난다", s:{건성:2}},
    {t:"전체적으로 번들거린다", s:{지성:2}},
    {t:"T존만 번들, 볼은 보통이거나 건조", s:{복합성:2}},
    {t:"화끈거리거나 붉어진다", s:{민감성:2}},
    {t:"특별히 당기지도 번들거리지도 않는다", s:{}},
  ]},
  {q:"모공과 피지 상태는?", opts:[
    {t:"모공이 거의 안 보이고 피지가 적다", s:{건성:1}},
    {t:"모공이 넓고 피지가 많다", s:{지성:1,여드름성:1}},
    {t:"T존만 모공·피지가 두드러진다", s:{복합성:1}},
    {t:"보통이다", s:{}},
  ]},
  {q:"여드름·트러블이 올라오는 빈도는?", opts:[
    {t:"자주, 여러 개씩 올라온다", s:{여드름성:2}},
    {t:"가끔 한두 개 올라온다", s:{여드름성:1}},
    {t:"거의 없다", s:{}},
  ]},
  {q:"새 화장품을 쓸 때 자극(따가움·붉어짐)은?", opts:[
    {t:"자주 생긴다, 맞는 제품 찾기 어렵다", s:{민감성:2}},
    {t:"가끔 생긴다", s:{민감성:1}},
    {t:"거의 없다, 웬만한 건 잘 맞는다", s:{}},
  ]},
  {q:"계절·환경이 바뀌면 피부는?", opts:[
    {t:"건조해지고 갈라진다", s:{건성:1}},
    {t:"유분이 더 많아진다", s:{지성:1}},
    {t:"쉽게 예민해지고 붉어진다", s:{민감성:1}},
    {t:"부위별로 다르게 반응한다", s:{복합성:1}},
  ]},
  {q:"오후 무렵 얼굴 상태는?", opts:[
    {t:"여전히 당기고 건조하다", s:{건성:1}},
    {t:"전체적으로 번들거린다", s:{지성:1}},
    {t:"T존만 번들거린다", s:{복합성:1}},
    {t:"크게 변화 없다", s:{}},
  ]},
  {q:"가장 개선하고 싶은 고민은?", opts:[
    {t:"수분·건조", goal:"보습"},
    {t:"주름·탄력·노화", goal:"안티에이징"},
    {t:"미백·잡티·칙칙함", goal:"미백"},
    {t:"트러블·여드름", goal:"트러블", s:{여드름성:1}},
    {t:"진정·홍조", goal:"진정", s:{민감성:1}},
  ]},
];

// 고민 → 카테고리 키워드 매핑(추천 정렬 가중치)
const GOAL_KEYWORDS = {
  "보습":["보습","장벽"], "안티에이징":["주름","안티","탄력"],
  "미백":["미백","톤"], "트러블":["트러블","여드름","모공"],
  "진정":["진정","재생"], "":[]
};

let step=0, answers=[];
const quiz=document.getElementById("quiz"), prog=document.getElementById("prog");

function render(){
  if(step>=QUESTIONS.length){ showResult(); return; }
  const Q=QUESTIONS[step];
  prog.style.width=((step)/QUESTIONS.length*100)+"%";
  quiz.innerHTML=`<div class="q">
    <div class="qnum">질문 ${step+1} / ${QUESTIONS.length}</div>
    <div class="qtext">${Q.q}</div>
    ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}
    <div class="nav"><button id="prev" ${step===0?"disabled":""}>← 이전</button><span></span></div>
  </div>`;
  quiz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[step]=Q.opts[+b.dataset.i]; step++; render();
  });
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{ step=Math.max(0,step-1); render(); };
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function showResult(){
  prog.style.width="100%";
  // 점수 집계
  const score={건성:0,지성:0,민감성:0,복합성:0,여드름성:0};
  let goal="";
  answers.forEach(a=>{
    if(a.s) for(const k in a.s) score[k]+=a.s[k];
    if(a.goal) goal=a.goal;
  });
  // 최고점 타입 (동점이면 민감성>여드름성>건성>지성>복합성 우선)
  const order=["민감성","여드름성","건성","지성","복합성"];
  let type=order[0], max=-1;
  order.forEach(t=>{ if(score[t]>max){max=score[t];type=t;} });
  if(max===0) type="복합성"; // 뚜렷한 특징 없으면 복합성

  const LEAD={
    건성:"수분과 유분이 부족하기 쉬운 타입이에요. 보습과 장벽 케어가 핵심입니다.",
    지성:"피지 분비가 많은 타입이에요. 가벼운 보습과 피지·모공 관리가 좋아요.",
    민감성:"외부 자극에 예민한 타입이에요. 순한 진정 성분 위주로, 향료는 피하세요.",
    복합성:"부위별로 다른 타입이에요. T존은 가볍게, 볼은 보습 위주로 나눠 관리하세요.",
    여드름성:"트러블이 잦은 타입이에요. 모공·피지 관리와 항염 성분이 도움됩니다."
  };
  document.getElementById("rtype").textContent=type+" 피부";
  document.getElementById("rlead").textContent=LEAD[type];
  document.getElementById("f_type").value=type;  // 리포트 폼에 진단결과 첨부

  // 추천: 해당 타입 good, 향료/주의성분 제외, 고민 카테고리 우선 + 안전등급 낮은 순
  const kws=GOAL_KEYWORDS[goal]||[];
  const pool=DATA.ingredients.filter(i=>i.skin_types[type]==="good" && !/주의 성분/.test(i.category));
  pool.sort((a,b)=>{
    const ag=kws.some(k=>a.category.includes(k))?0:1;
    const bg=kws.some(k=>b.category.includes(k))?0:1;
    if(ag!==bg) return ag-bg;
    return a.safety_grade-b.safety_grade;
  });
  document.getElementById("recommend").innerHTML=pool.slice(0,8).map(card).join("")
    || '<p style="color:#8a7f76">추천 성분을 준비 중입니다.</p>';

  // 추천 제품: 진단 피부타입과 매칭되는 제휴 제품
  const prods=(PRODUCTS.products||[]).filter(p=>(p.skin_types||[]).includes(type));
  const psec=document.getElementById("productSection");
  if(prods.length){
    document.getElementById("products").innerHTML=prods.slice(0,6).map(pcard).join("");
    document.getElementById("affNotice").textContent=PRODUCTS.affiliate_notice||"";
    psec.style.display="block";
  } else { psec.style.display="none"; }

  // 주의: 해당 타입 bad/caution 중 안전등급 높은 순
  const avoid=DATA.ingredients.filter(i=>["bad","caution"].includes(i.skin_types[type]))
    .sort((a,b)=>b.safety_grade-a.safety_grade).slice(0,4);
  document.getElementById("avoid").innerHTML=avoid.map(card).join("")
    || '<p style="color:#8a7f76">특별히 주의할 성분이 없어요.</p>';

  document.getElementById("result").style.display="block";
  quiz.style.display="none";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function card(i){
  const url=`detail/${encodeURIComponent(i.id)}.html`;
  return `<div class="icard">
    <span class="cat">${esc(i.category)}</span>
    <div class="kn"><a href="${url}">${esc(i.korean_name)}</a></div>
    <div class="d">${esc(i.description.slice(0,70))}${i.description.length>70?"…":""}</div>
    <div class="b">${(i.benefits||[]).slice(0,3).map(b=>`<span>#${esc(b)}</span>`).join("")}</div>
  </div>`;
}

function pcard(p){
  const img=p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:"";
  const note=p.note?`<div class="pnote">${esc(p.note)}</div>`:"";
  const price=p.price?`<span class="ppr">${esc(p.price)}</span>`:"<span></span>";
  const badge=p.source?`<span class="psrc">${esc(p.source)}</span>`:"";
  const src=p.source?esc(p.source):"제휴처";
  return `<a class="pcard" href="${esc(p.url)}" target="_blank" rel="nofollow sponsored noopener">
    ${img}<div class="pb">${badge}<div class="pn">${esc(p.name)}</div>${note}
    <div class="prow">${price}<span class="pbt">${src}에서 보기 →</span></div></div></a>`;
}

function restart(){ step=0; answers=[]; document.getElementById("result").style.display="none"; quiz.style.display="block"; render(); }

// 리포트 신청 폼 → Netlify Forms로 전송 (서버 없이 제출 수집)
const leadForm=document.getElementById("leadForm");
leadForm.addEventListener("submit",e=>{
  e.preventDefault();
  if(!document.getElementById("f_consent").checked){ alert("개인정보 수집·이용 동의가 필요합니다."); return; }
  const btn=leadForm.querySelector("button[type=submit]");
  btn.disabled=true; btn.textContent="전송 중…";
  const body=new URLSearchParams(new FormData(leadForm)).toString();
  fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body})
    .then(r=>{ if(!r.ok) throw 0;
      document.getElementById("leadDone").style.display="block";
      document.getElementById("f_email").style.display="none";
      leadForm.querySelector(".lf-consent").style.display="none";
      btn.style.display="none";
    })
    .catch(()=>{ btn.disabled=false; btn.textContent="리포트 받기";
      alert("전송에 실패했어요. 잠시 후 다시 시도해 주세요.\n(로컬 미리보기에서는 작동하지 않고, 배포된 사이트에서만 전송됩니다.)"); });
});
