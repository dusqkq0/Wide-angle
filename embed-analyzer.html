<title>전성분 분석 위젯</title>
<style>
  :root{--accent:#b08968;--ink:#2b2622;--sub:#8a7f76;--line:#eee5dd;

  html,body{height:100%}

  .wtitle .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  textarea{width:100%;height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;resize:none}

  .bar{display:flex;gap:8px;margin-top:8px;align-items:center}
  select{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  button{padding:9px 16px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
  button:hover{filter:brightness(.95)}
  .ex{font-size:11px;color:var(--sub);margin-top:6px}
  .ex a{color:var(--accent);cursor:pointer;text-decoration:underline}
  #result{flex:1;overflow-y:auto;margin-top:10px}
  .sum{border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:10px}
  .sum.g{background:var(--good-bg);color:var(--good)} .sum.c{background:var(--caution-bg);color:var(--caution)} .sum.b{background:var(--bad-bg);color:var(--bad)}
  .ing{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}

  .ing .ct{font-size:11px;color:var(--sub)}
  .fit{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .good{background:var(--good-bg);color:var(--good)}.caution{background:var(--caution-bg);color:var(--caution)}.bad{background:var(--bad-bg);color:var(--bad)}
  .unknown{font-size:11.5px;color:var(--sub);background:#f6f1ec;border-radius:9px;padding:9px 11px;margin-top:6px}
  .pb{text-align:center;font-size:10.5px;color:#b3a89c;padding-top:8px}
  .pb a{color:#b3a89c;text-decoration:none}
</style>
</head>

const SITE = "https://merry-gelato-2a6bc1.netlify.app/";

const base = SITE && SITE.indexOf("__")<0 ? SITE : "https://merry-gelato-2a6bc1.netlify.app/";

const FIT={good:"추천",caution:"주의",bad:"비추천"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/[\s()\[\]{}·,./\-_+]/g,"")}
function gc(g){return g<=2?'#3a9b6e':g<=6?'#c98a1b':'#c4534f'}
function cp(a,b){let n=0,m=Math.min(a.length,b.length);while(n<m&&a[n]===b[n])n++;return n;}
const IDX=[];DATA.ingredients.forEach(i=>{IDX.push([norm(i.korean_name),i]);if(i.inci_name)IDX.push([norm(i.inci_name),i]);});
function match(tok){const t=norm(tok);if(t.length<2)return null;let best=null,bs=0;
  for(const [k,i] of IDX){if(!k)continue;if(k===t)return i;let s=0;
    if(t.includes(k)&&k.length>=3)s=k.length+1;else if(k.includes(t)&&t.length>=3)s=t.length;else{const c=cp(k,t);if(c>=5)s=c;}
    if(s>bs){bs=s;best=i;}}return best;}

function demo(){document.getElementById("input").value="정제수, 글리세린, 나이아신아마이드, 센텔라아시아티카추출물, 판테놀, 하이알루로닉애씨드, 향료, 리모넨";document.getElementById("skin").value="민감성";}

function run(){
  const raw=document.getElementById("input").value.trim();
  if(!raw){alert("전성분을 붙여넣어 주세요.");return;}
  const skin=document.getElementById("skin").value;
  const toks=raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
  const seen=new Set(),matched=[],unknown=[];
  toks.forEach(t=>{const m=match(t);if(m){if(!seen.has(m.id)){seen.add(m.id);matched.push(m);}}else unknown.push(t.replace(/\d+(\.\d+)?%?$/,"").trim());});
  let bad=0,cau=0,good=0;
  if(skin)matched.forEach(i=>{const v=i.skin_types[skin];if(v==="bad")bad++;else if(v==="caution")cau++;else if(v==="good")good++;});
  const R=document.getElementById("result");let html="";
  if(skin){
    let cls="g",msg=`<b>${skin} 피부에 잘 맞는 편이에요 👍</b> 추천 성분 ${good}개`;
    if(bad){cls="b";msg=`<b>${skin} 피부에 주의가 필요해요</b> 비추천 성분 ${bad}개 포함`;}
    else if(cau>=2){cls="c";msg=`<b>대체로 무난하나 주의 성분이 있어요</b> 주의 ${cau}개`;}
    html+=`<div class="sum ${cls}">${msg}</div>`;
  } else html+=`<div class="sum g"><b>${matched.length}개 성분 분석 완료</b> · 피부타입을 고르면 적합도까지 보여드려요</div>`;
  const rank=i=>{if(!skin)return 10-i.safety_grade;const v=i.skin_types[skin];return ({bad:0,caution:1,good:2}[v]??1)*100-i.safety_grade;};
  matched.sort((a,b)=>rank(a)-rank(b));
  html+=matched.map(i=>{const v=skin?i.skin_types[skin]:null;
    const url=base.replace(/\/$/,'')+'/detail/'+encodeURIComponent(i.id)+'.html';
    return `<div class="ing"><span class="gb" style="background:${gc(i.safety_grade)}">${i.safety_grade}</span>
      <div><div class="nm"><a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(i.korean_name)}</a></div><div class="ct">${esc(i.category)}</div></div>

  if(unknown.length){const u=[...new Set(unknown.filter(x=>x.length>1))].slice(0,20);
    html+=`<div class="unknown">사전에 없는 성분: ${u.map(esc).join(", ")}</div>`;}

}
